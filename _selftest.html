<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>selftest</title>
<style>html,body{margin:0;height:100%;background:#111}#garden{position:fixed;inset:0;width:100%;height:100%}</style>
<script>
window.__err = [];
window.addEventListener('error', function (e) { window.__err.push(e.message + ' @' + e.lineno); });
</script>
</head><body>
<canvas id="garden"></canvas>
<div id="statFlowers">0</div><div id="statButterflies">0</div><div id="statPicked">0</div>
<div id="statTime"></div><div id="statWeather"></div><div id="hint"></div>
<select id="seedSelect"><option value="random">r</option></select>
<button id="btnFlower"></button><button id="btnButterfly"></button><button id="btnRain"></button>
<button id="btnDayNight"></button><button id="btnPause"></button><button id="btnClear"></button>
<script src="script.js"></script>
<script>
setTimeout(function () {
  var g = window.garden;
  var msg = 'ERR=' + JSON.stringify(window.__err);
  if (g) {
    /* exercise the controls too */
    g.pointer.active = true; g.pointer.x = g.w * 0.5; g.pointer.y = g.horizonY * 0.5;
    g.toggleRain(); g.plant(g.w * 0.3, g.h * 0.8); g.addButterfly();
    g.gardener.x = g.w * 0.4; g.gardener.y = g.h * 0.9;
    msg += ' flowers=' + g.flowers.length + ' bf=' + g.butterflies.length +
           ' grass=' + g.grass.length + ' hour=' + g.hour.toFixed(2) +
           ' rain=' + g.rainTarget + ' picked=' + g.picked +
           ' gd=' + g.gardener.x.toFixed(0) + ',' + g.gardener.y.toFixed(0) +
           ' ground=' + g.groundAt(g.gardener.x).toFixed(0) + ' h=' + g.h;
  } else { msg += ' GARDEN_MISSING'; }
  document.title = msg;
}, 500);
</script></body></html>
