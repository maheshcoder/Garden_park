<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>qa</title>
<link rel="stylesheet" href="style.css">
<style>#qaout{position:fixed;left:0;bottom:0;z-index:99;font:11px monospace;color:#0f0;background:#000c;max-height:60vh;overflow:auto;padding:6px;white-space:pre-wrap}</style>
<script>
window.__err = [];
window.addEventListener('error', function (e) { window.__err.push(e.message + ' @line' + e.lineno); });
</script>
</head><body>
<canvas id="garden"></canvas>
<header id="hud"><h1>HUD</h1><div class="stats">
<span class="chip"><b id="statFlowers">0</b></span><span class="chip"><b id="statButterflies">0</b></span>
<span class="chip"><b id="statPicked">0</b></span><span class="chip"><b id="statTime">09:00</b></span>
<span class="chip" id="statWeather">Clear</span></div></header>
<aside id="panel"><div class="panel-title">Controls</div>
<div class="row"><label for="seedSelect">Seed</label>
<select id="seedSelect"><option value="random">Random</option><option value="rose">Rose</option>
<option value="daisy">Daisy</option><option value="sunflower">Sunflower</option>
<option value="tulip">Tulip</option><option value="lavender">Lavender</option></select></div>
<div class="buttons">
<button id="btnFlower">Plant</button><button id="btnButterfly">Butterfly</button>
<button id="btnRain">Rain</button><button id="btnDayNight">Day / Night</button>
<button id="btnPause">Pause</button><button id="btnClear">Clear</button></div>
<p class="hint" id="hint"></p></aside>
<footer id="keys"></footer>
<pre id="qaout"></pre>
<script src="script.js"></script>
<script>
var L = [], PASS = 0, FAIL = 0;
function ok(name, cond, extra) {
  if (cond) { PASS++; L.push('PASS  ' + name); }
  else { FAIL++; L.push('FAIL  ' + name + (extra !== undefined && extra !== null ? '   [' + extra + ']' : '')); }
}
function say(m) { L.push('--    ' + m); }
function key(k) {
  window.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true }));
  window.dispatchEvent(new KeyboardEvent('keyup', { key: k, bubbles: true }));
}
function hold(k) { window.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true })); }
function release(k) { window.dispatchEvent(new KeyboardEvent('keyup', { key: k, bubbles: true })); }
function click(id) { document.getElementById(id).click(); }
function ptr(type, x, y, opts) {
  var e = new PointerEvent(type, Object.assign(
    { clientX: x, clientY: y, bubbles: true, cancelable: true, button: 0 }, opts || {}));
  document.getElementById('garden').dispatchEvent(e);
}
function up() { window.dispatchEvent(new PointerEvent('pointerup', { bubbles: true })); }
/* ui.tick() is throttled to 160ms, but refresh() clears the throttle, so
   calling tick directly after a click applies the same UI update the next
   animation frame would have.                                            */
function uiNow() { ui.refresh(); ui.tick(performance.now() + 1000); }
/* Headless --dump-dom never produces animation frames (verified: rAF fires 0
   times even on a visible page), so no test may wait on rAF. Virtual time
   does advance setTimeout, which is why uiNow() can force a UI refresh.   */
function uiNow() { ui.refresh(); ui.tick(performance.now() + 1000); }
var reported = false;
function report() {
  if (reported) return;
  reported = true;
  document.getElementById('qaout').textContent =
    'RESULT ' + PASS + '/' + (PASS + FAIL) + '  (fail=' + FAIL + ')\n' + L.join('\n');
  document.title = (FAIL === 0 ? 'ALLPASS ' : 'FAILURES=' + FAIL + ' ') + PASS + '/' + (PASS + FAIL);
}
/* everything below runs synchronously: headless gives us no animation
     frames, so nothing may depend on the rAF loop actually ticking.        */
function runAll(g) {
  /* ---------------- boot ---------------- */
  ok('boot: no JS errors', window.__err.length === 0, window.__err.join(' | '));
  ok('boot: flowers seeded', g.flowers.length > 20, g.flowers.length);
  ok('boot: butterflies seeded', g.butterflies.length > 5, g.butterflies.length);
  ok('boot: grass built', g.grass.length > 200, g.grass.length);
  ok('boot: gardener starts on the lawn',
    g.gardener.y > g.groundAt(g.gardener.x) && g.gardener.y < g.h,
    g.gardener.y.toFixed(1) + ' ground=' + g.groundAt(g.gardener.x).toFixed(1));
  ok('boot: sky is not black', g.skyNow.top !== 'rgb(0,0,0)', g.skyNow.top);

  /* ---------------- plant / clear buttons ---------------- */
  var f0 = g.flowers.length;
  click('btnFlower');
  ok('btnFlower plants a flower', g.flowers.length === f0 + 1, f0 + ' -> ' + g.flowers.length);
  var planted = g.flowers[g.flowers.length - 1];
  ok('btnFlower plants it on the lawn', planted.y > g.groundAt(planted.x),
    planted.y.toFixed(1) + ' vs ground ' + g.groundAt(planted.x).toFixed(1));
  click('btnClear');
  ok('btnClear empties the garden', g.flowers.length === 0, g.flowers.length);

  /* ---------------- butterfly button ---------------- */
  var b0 = g.butterflies.length;
  click('btnButterfly');
  ok('btnButterfly adds one', g.butterflies.length === b0 + 1, b0 + ' -> ' + g.butterflies.length);
  var nb = g.butterflies[g.butterflies.length - 1];
  ok('btnButterfly spawns it in the sky near the gardener',
    nb.y < g.horizonY && Math.abs(nb.x - g.gardener.x) < 140,
    nb.y.toFixed(0) + ' horizon=' + g.horizonY.toFixed(0));

  /* ---------------- rain button ---------------- */
  var r0 = g.rainTarget;
  click('btnRain');
  ok('btnRain toggles rainTarget', g.rainTarget !== r0, r0 + ' -> ' + g.rainTarget);
  uiNow();
  ok('btnRain marks itself active', document.getElementById('btnRain').classList.contains('on'));
  /* leave rain ON: the blend/droplet checks below need it running */
  ok('rain blends in over time', (g.fastForward(3), g.rain > 0.4), g.rain.toFixed(2));
  ok('rain spawns droplets', g.drops.length > 0, g.drops.length);
  click('btnRain');
  uiNow();
  ok('btnRain toggles back', g.rainTarget === r0, g.rainTarget);
  ok('btnRain clears .on', !document.getElementById('btnRain').classList.contains('on'));

  /* ---------------- day / night button ---------------- */
  var h0 = g.hourTarget;
  click('btnDayNight');
  var target = g.hourTarget;
  ok('btnDayNight sets a new hour target', target !== null && target !== h0, String(h0) + ' -> ' + String(target));
  ok('btnDayNight target is day or night', target > 18 || target < 8, String(target));
  g.fastForward(4);
  ok('hour eases toward the target', Math.abs(g.hour - target) < 1.5, g.hour.toFixed(2) + ' vs ' + String(target));
  click('btnDayNight');
  ok('btnDayNight flips back toward day', g.hourTarget < 12, String(g.hourTarget));

  /* ---------------- pause button ---------------- */
  click('btnPause');
  uiNow();
  ok('btnPause pauses', g.paused === true);
  ok('btnPause shows Resume', document.getElementById('btnPause').textContent.indexOf('Resume') > -1,
    document.getElementById('btnPause').textContent);
  /* rAF never fires under --dump-dom, so the render loop never runs and a
     wait-based check would pass vacuously. Instead prove the guard is
     load-bearing: the real start() loop must gate update() on !paused, and
     update() really does advance time, so that guard is the only thing
     stopping the simulation.                                             */
  var loopSrc = garden.start.toString();
  ok('start() gates update() on !this.paused', /!\s*this\.paused\s*\)?\s*this\.update/.test(loopSrc),
    loopSrc.replace(/\s+/g, ' ').slice(0, 140));
  var ph = g.hour;
  g.update(0.05);
  ok('update() really does advance time', g.hour !== ph, ph.toFixed(3) + ' -> ' + g.hour.toFixed(3));
  click('btnPause');
  uiNow();
  ok('btnPause resumes', g.paused === false);
  ok('btnPause shows Pause again', document.getElementById('btnPause').textContent.indexOf('Pause') > -1,
    document.getElementById('btnPause').textContent);

  /* ---------------- keyboard: plant / butterfly / clear ---------------- */
  click('btnClear');
  key(' ');
  ok('Space plants near the gardener', g.flowers.length === 1, g.flowers.length);
  ok('Space plant is close to the gardener',
    Math.abs(g.flowers[0].x - g.gardener.x) < 40, Math.abs(g.flowers[0].x - g.gardener.x).toFixed(0));
  key('b');
  ok('B adds a butterfly', g.butterflies.length === b0 + 2, g.butterflies.length);
  key('c');
  ok('C clears the garden', g.flowers.length === 0, g.flowers.length);

  /* ---------------- keyboard: rain / day-night / pause ---------------- */
  var kr = g.rainTarget;
  key('r');
  ok('R toggles rain', g.rainTarget !== kr, kr + ' -> ' + g.rainTarget);
  key('r');
  ok('R toggles rain back', g.rainTarget === kr, g.rainTarget);
  /* toggleDayNight() decides from the current hour, not from hourTarget, so
     pin a known hour first or the expected flip is ambiguous.          */
  g.hour = 12; g.hourTarget = null;
  key('n');
  ok('N at noon jumps to night', g.hourTarget > 18, String(g.hourTarget));
  g.hour = 23;
  key('n');
  ok('N at night jumps to day', g.hourTarget < 12, String(g.hourTarget));
  key('p');
  ok('P pauses', g.paused === true);
  key('p');
  ok('P resumes', g.paused === false);
  key('n');

  /* ---------------- keyboard: walking ---------------- */
  var x0 = g.gardener.x;
  hold('d'); g.fastForward(0.6); release('d');
  ok('D walks right', g.gardener.x > x0 + 20, x0.toFixed(0) + ' -> ' + g.gardener.x.toFixed(0));
  ok('faces right', g.gardener.face === 1, g.gardener.face);
  x0 = g.gardener.x;
  hold('a'); g.fastForward(0.6); release('a');
  ok('A walks left', g.gardener.x < x0 - 20, x0.toFixed(0) + ' -> ' + g.gardener.x.toFixed(0));
  ok('faces left', g.gardener.face === -1, g.gardener.face);
  var d0 = g.gardener.frac;
  hold('s'); g.fastForward(0.6); release('s');
  ok('S walks toward the viewer (depth increases)', g.gardener.frac > d0, d0.toFixed(2) + ' -> ' + g.gardener.frac.toFixed(2));
  d0 = g.gardener.frac;
  hold('w'); g.fastForward(0.6); release('w');
  ok('W walks toward the horizon (depth decreases)', g.gardener.frac < d0, d0.toFixed(2) + ' -> ' + g.gardener.frac.toFixed(2));
  x0 = g.gardener.x;
  hold('ArrowRight'); g.fastForward(0.5); release('ArrowRight');
  ok('ArrowRight also walks', g.gardener.x > x0 + 15, x0.toFixed(0) + ' -> ' + g.gardener.x.toFixed(0));

  /* ---------------- watering ---------------- */
  g.gardener.frac = 0.7; g.fastForward(0.1);
  g.plant(g.gardener.x + 10, g.gardener.y, true);
  var tgt = g.flowers[g.flowers.length - 1];
  var wet0 = tgt.water;
  hold('e'); g.fastForward(0.5);
  ok('E starts pouring', g.gardener.pouring === true);
  ok('E waters the nearby flower', tgt.water > wet0, wet0.toFixed(2) + ' -> ' + tgt.water.toFixed(2));
  release('e'); g.fastForward(0.4);
  ok('releasing E stops pouring', g.gardener.pouring === false);

  /* ---------------- pointer: plant, pick, remove ---------------- */
  var px = g.w * 0.5, py = g.h * 0.8;
  var fc = g.flowers.length;
  ptr('pointerdown', px, py); up();
  ok('clicking grass plants a flower', g.flowers.length === fc + 1, fc + ' -> ' + g.flowers.length);
  var p2 = g.flowers[g.flowers.length - 1];
  ok('click-plant lands where clicked',
    Math.abs(p2.x - px) < 2 && Math.abs(p2.y - py) < 2, p2.x.toFixed(0) + ',' + p2.y.toFixed(0));
  ptr('pointermove', p2.x, p2.y);
  g.update(1 / 60);
  ok('moving the pointer hovers the flower', p2.hover > 0, p2.hover);
  var pk = g.picked;
  ptr('pointerdown', p2.x, p2.y); up();
  ok('clicking a flower picks it', g.picked === pk + 1, pk + ' -> ' + g.picked);
  ok('picked flower is removed', g.flowers.indexOf(p2) === -1);

  g.plant(px, py, true);
  var p3 = g.flowers[g.flowers.length - 1];
  ptr('pointerdown', p3.x, p3.y, { button: 2 }); up();
  ok('right-click removes a flower', g.flowers.indexOf(p3) === -1);
  ok('right-click is not counted as a pick', g.picked === pk + 1, g.picked);

  /* ---------------- capacity limits ---------------- */
  g.paused = true;
  var guard = 0;
  while (g.flowers.length < 200 && guard++ < 400) { if (!g.plant(10 + Math.random() * (g.w - 20), null, true)) break; }
  ok('flower cap is 90', g.flowers.length === 90, g.flowers.length);
  guard = 0;
  while (g.butterflies.length < 200 && guard++ < 400) g.addButterfly(g.w * 0.5, g.horizonY * 0.5);
  ok('butterfly cap is 34', g.butterflies.length === 34, g.butterflies.length);
  g.paused = false;

  /* ---------------- seed select ---------------- */
  var sel = document.getElementById('seedSelect');
  sel.value = 'tulip'; sel.dispatchEvent(new Event('change'));
  ok('seed select sets seedType', g.seedType === 'tulip', g.seedType);
  g.clearGarden();
  for (var i = 0; i < 6; i++) g.plant(g.w * 0.3 + i * 8, g.h * 0.8, true);
  ok('tulip seed plants only tulips',
    g.flowers.length === 6 && g.flowers.every(function (f) { return f.type === 'tulip'; }),
    g.flowers.map(function (f) { return f.type; }).join(','));
  sel.value = 'random'; sel.dispatchEvent(new Event('change'));
  ok('seed select back to random', g.seedType === 'random', g.seedType);

  /* ---------------- responsive resizing ---------------- */
  var sizes = [[360, 640], [414, 896], [768, 1024], [1024, 600], [1280, 720], [1440, 900], [1920, 1080], [2000, 1200]];
  var allOk = true, lines = [];
  for (var s = 0; s < sizes.length; s++) {
    var cvs = document.getElementById('garden');
    cvs.style.position = 'absolute'; cvs.style.inset = 'auto';
    cvs.style.width = sizes[s][0] + 'px'; cvs.style.height = sizes[s][1] + 'px';
    window.dispatchEvent(new Event('resize'));
    g.gardener.frac = 0.6;
    g.fastForward(0.2);
    var gdOk = g.gardener.y > g.groundAt(g.gardener.x) &&
               g.gardener.y <= g.h - 10 && g.gardener.x >= 20 && g.gardener.x <= g.w - 20;
    var flOk = g.flowers.every(function (f) { return isFinite(f.x) && isFinite(f.y) && f.y <= g.h + 1; });
    var bfOk = g.butterflies.every(function (b) { return isFinite(b.x) && isFinite(b.y) && b.x >= 0 && b.x <= g.w; });
    var bufOk = cvs.width === Math.round(sizes[s][0] * g.dpr) && cvs.height === Math.round(sizes[s][1] * g.dpr);
    if (!(gdOk && flOk && bfOk && bufOk)) allOk = false;
    lines.push(sizes[s][0] + 'x' + sizes[s][1] + ' gd=' + g.gardener.x.toFixed(0) + ',' +
      g.gardener.y.toFixed(0) + '/' + g.h + (gdOk ? '' : '!GD') + (flOk ? '' : '!FL') +
      (bfOk ? '' : '!BF') + (bufOk ? '' : '!BUF'));
  }
  ok('resize: everyone stays in frame at every size', allOk, '');
  say('resize trace: ' + lines.join('  |  '));
  ok('resize: horizon rescales with height', Math.abs(g.horizonY - g.h * 0.62) < 1,
    g.horizonY.toFixed(0) + ' vs ' + (g.h * 0.62).toFixed(0));
  ok('resize: grass stays dense', g.grass.length > 200, g.grass.length);
  ok('resize: no NaN anywhere',
    isFinite(g.gardener.x) && isFinite(g.gardener.y) && isFinite(g.horizonY) && isFinite(g.w));

  /* ---------------- colour pipeline (the old rgb() black-sky bug) ------- */
  function bright(css) { var c = parseColor(css); return c.r + c.g + c.b; }
  ok('parseColor reads 6-digit hex', bright('#ff8800') === 391, JSON.stringify(parseColor('#ff8800')));
  ok('parseColor expands 3-digit hex', bright('#f80') === 391, JSON.stringify(parseColor('#f80')));
  ok('parseColor reads rgb()', bright('rgb(12,34,56)') === 102, JSON.stringify(parseColor('rgb(12,34,56)')));
  /* sampleSky() returns top/bot (only two bands), not mid/low */
  var sky = g.skyNow;
  ok('sky has top and bot bands', typeof sky.top === 'string' && typeof sky.bot === 'string',
    sky.top + ' / ' + sky.bot);
  ok('sky bands are two distinct colours', sky.top !== sky.bot, sky.top + ' vs ' + sky.bot);
  ok('sky bands are all bright enough', bright(sky.top) > 10 && bright(sky.bot) > 10,
    bright(sky.top) + ',' + bright(sky.bot));
  ok('parseColor survives a missing colour', (function () { var c = parseColor(undefined); return c.r === 0; })());

  /* ---------------- draw sweep: every hour, rain on and off ------------- */
  try {
    [0, 4, 6.5, 9, 12, 17, 19.5, 22, 23.5].forEach(function (hh) {
      g.hour = hh; g.hourTarget = null; g.skyNow = sampleSky(hh); g.draw();
    });
    [0, 0.5, 1].forEach(function (rr) { g.rain = rr; g.rainTarget = rr; g.draw(); });
    ok('draw() succeeds at every hour and rain level', true);
  } catch (e) {
    ok('draw() succeeds at every hour and rain level', false, e.message);
  }
  g.rain = 0; g.rainTarget = 0;

  /* ---------------- long soak: NaN / runaway growth --------------------- */
  var errAt = window.__err.length;
  g.fastForward(60);
  ok('60s soak: no JS errors', window.__err.length === errAt, window.__err.slice(errAt).join(' | '));
  ok('60s soak: all positions finite',
    g.flowers.every(function (f) { return isFinite(f.x) && isFinite(f.y) && isFinite(f.grow); }) &&
    g.butterflies.every(function (b) { return isFinite(b.x) && isFinite(b.y); }) &&
    isFinite(g.gardener.x) && isFinite(g.gardener.y));
  ok('60s soak: water stays in range',
    g.flowers.every(function (f) { return isFinite(f.water) && f.water >= 0 && f.water <= 1.05; }),
    'max=' + Math.max.apply(null, g.flowers.map(function (f) { return f.water; })).toFixed(2));
  ok('60s soak: populations respect caps', g.flowers.length <= 90 && g.butterflies.length <= 34,
    g.flowers.length + ' flowers / ' + g.butterflies.length + ' butterflies');
  ok('60s soak: hour stays in [0,24)', g.hour >= 0 && g.hour < 24, g.hour.toFixed(2));
  ok('60s soak: particle pools bounded',
    g.sparks.length < 400 && g.drops.length < 1200, g.sparks.length + ' sparks / ' + g.drops.length + ' drops');
  report();
}
setTimeout(function () {
  var g = window.garden;
  if (!g) { ok('garden exists', false); report(); return; }
  /* runAll() finishes asynchronously because it waits on animation frames,
     so report() is idempotent and simply called from the final stage. */
  try { runAll(g); } catch (e) {
    ok('harness ran to completion', false, 'THREW: ' + e.message + ' | ' + String(e.stack || '').split('\n')[1]);
    report();
  }
}, 350);
</script></body></html>
